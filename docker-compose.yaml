# =========================================================
# Common Configurations (DRY) 
# =========================================================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://\({POSTGRES_USER:-airflow}:\){POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - data_pipeline

services:
  # =========================================================
  # PostgreSQL - Airflow Metadata Database
  # =========================================================
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \\({POSTGRES_USER:-airflow} -d\\){POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_pipeline

  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' 
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - data_pipeline
  # =========================================================
  # Kafka Python Application
  # =========================================================
  kafka-app:
    build:
      context: .
      dockerfile: docker/kafka/Dockerfile
    volumes:
      - ./kafka_scripts:/app/scripts
    depends_on:
      - kafka
    networks:
      - data_pipeline
    command: tail -f /dev/null 

  # =========================================================
  # Spark
  # =========================================================
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    volumes:
      - ./spark_jobs:/opt/spark/jobs
    depends_on:
      - kafka
    networks:
      - data_pipeline
    command: tail -f /dev/null 

  # =========================================================
  # dbt
  # =========================================================
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    volumes:
      - ./dbt_project:/usr/app/dbt
    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
    networks:
      - data_pipeline
    command: tail -f /dev/null 

  # =========================================================
  # Airflow Initialization
  # =========================================================
  airflow-init:
    <<: *airflow-common 
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true

  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    <<: *airflow-common 
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # =========================================================
  # Airflow Webserver
  # =========================================================
  airflow-webserver:
    <<: *airflow-common 
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

# =========================================================
# Volumes & Networks
# =========================================================
volumes:
  postgres_data:
  kafka_data:

networks:
  data_pipeline:
    driver: bridge